[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csvx"
version = "1.0.0"
description = "Command-Line Data Analysis & Data Quality Toolkit"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "CSVX Team" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
csvx = "csvx.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["csvx*"]
